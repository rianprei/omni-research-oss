name: Experimental host sampling bridge
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/host_sampling_*.py'
      - 'server/owner_oauth.py'
      - 'tests/test_owner_oauth.py'
      - 'scripts/host_sampling_oauth_smoke.py'
      - 'server/inbound_ip_filter.py'
      - 'tests/test_inbound_ip_filter.py'
      - 'tests/test_openai_egress_allowlist.py'
      - 'tests/test_host_sampling_core.py'
      - 'scripts/host_sampling_smoke.py'
      - '.github/workflows/host-sampling-ci.yml'
  push:
    branches: [main]
    paths:
      - 'server/host_sampling_*.py'
      - 'server/owner_oauth.py'
      - 'tests/test_owner_oauth.py'
      - 'scripts/host_sampling_oauth_smoke.py'
      - 'server/inbound_ip_filter.py'
      - 'tests/test_inbound_ip_filter.py'
      - 'tests/test_openai_egress_allowlist.py'
      - 'tests/test_host_sampling_core.py'
      - '.github/workflows/host-sampling-ci.yml'
permissions:
  contents: read
jobs:
  sampling:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install official MCP Python SDK
        run: pip install -r requirements-cloud.txt
      - name: Check code and run tests without any model credential
        run: |
          python -m compileall -q server/host_sampling_core.py server/host_sampling_cloud.py server/inbound_ip_filter.py server/owner_oauth.py scripts/host_sampling_oauth_smoke.py
          python -m unittest discover -s tests -p 'test_inbound_ip_filter.py' -v
          python -m unittest discover -s tests -p 'test_openai_egress_allowlist.py' -v
          python -m unittest discover -s tests -p 'test_host_sampling_core.py' -v
          python -m unittest discover -s tests -p 'test_owner_oauth.py' -v
      - name: Verify official ChatGPT egress feed format
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'server')
          from inbound_ip_filter import _fetch_openai_prefixes
          networks = _fetch_openai_prefixes()
          assert networks, "Official egress feed is empty"
          print("OFFICIAL_OPENAI_EGRESS_OK",len(networks))
          PY
      - name: Verify MCP app imports (requires bearer config)
        env:
          RENDER_EXTERNAL_HOSTNAME: localhost
          OMNI_AGENT_ACCESS_TOKEN: 'mock-local-only-test-token-longer-than-thirty-two-characters'
        run: |
          python -c "from server.host_sampling_cloud import mcp, app; print(mcp.name)"
      - name: Verify OAuth 2.1 DCR + PKCE owner-approved MCP end-to-end
        env:
          RENDER_EXTERNAL_HOSTNAME: localhost
          OMNI_AGENT_ACCESS_TOKEN: 'mock-local-only-test-token-longer-than-thirty-two-characters'
          OMNI_AGENT_PUBLIC_URL: http://localhost:8798
        run: |
          set -euo pipefail
          python -m uvicorn server.host_sampling_cloud:app --host 127.0.0.1 --port 8798 > /tmp/host-sampling.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for n in {1..45}; do
            if curl -fsS http://127.0.0.1:8798/healthz >/dev/null; then break; fi
            sleep .2
          done
          python scripts/host_sampling_oauth_smoke.py
