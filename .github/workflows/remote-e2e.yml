name: OmniResearch remote MCP full audit
on:
  push:
    branches: [main]
    paths:
      - "scripts/remote_e2e.py"
      - ".github/workflows/remote-e2e.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remote-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Invoke every public MCP tool, multiple providers, and SSRF guards
        run: python3 -u scripts/remote_e2e.py
